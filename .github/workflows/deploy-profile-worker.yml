name: Deploy UPCBadger Profile Worker

on:
  push:
    branches:
      - main
    paths:
      - 'services/profile-worker/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/profile-worker
          secrets: |
            OPENXBL_API_KEY
        env:
          OPENXBL_API_KEY: ${{ secrets.OPENXBL_API_KEY }}